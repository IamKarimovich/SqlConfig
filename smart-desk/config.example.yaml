# Smart Desk konfiqurasiyası.  Kopyala:  cp config.example.yaml config.yaml

# Sahib(lər): enroll.py --name ilə verdiyin ad(lar).
# Bir nəfər:  owner: ruslan      Bir neçə nəfər:  owner: [ruslan, aysel]
# Sahiblərdən hər hansı biri oturanda proqramlar açılır və kilid işləmir.
owner: [ruslan]
camera: 0                # kamera nömrəsi (0 = daxili webcam)
fps: 5                   # saniyədə neçə kadr analiz olunsun (CPU-ya qənaət)
camera_wait_seconds: 120 # kompüter yeni açılanda kamera hazır olana qədər gözlə

recognition:
  threshold: 0.40        # SFace cosine oxşarlığı; yuxarı = daha sərt (0.36–0.50)
  min_face_px: 70        # bundan kiçik (uzaqdakı) üzlərə məhəl qoyma

presence:
  arrive_frames: 3       # neçə ardıcıl kadrda tanınsan "gəldi" sayılır
  lock_after_seconds: 12 # səni görmədikdən neçə saniyə sonra kilidlə
  relaunch_after_minutes: 30  # bu qədər uzaq qalsan, qayıdanda iş mühiti yenidən açılır

# Masaya oturanda açılacaqlar (yalnız öz OS-in üçün olan siyahı işləyir).
# Hər element ya sadə əmrdir ("code"), ya da:
#   name: ad, paths: yoxlanılacaq yollar (ilk tapılan açılır),
#   start_menu: Windows Start menyusunda axtarılacaq ad (Store/MSIX proqramları üçün),
#   process: "artıq açıqdır?" yoxlaması üçün proses adı,
#   fallback: heç nə tapılmasa brauzerdə açılacaq link
# Proqram artıq açıqdırsa ikinci dəfə açılmır.
# Yoxlamaq üçün:  python desk.py --check-apps
on_arrival:
  windows:
    - name: Opera
      paths:
        - '%LOCALAPPDATA%\Programs\Opera\opera.exe'
        - '%LOCALAPPDATA%\Programs\Opera GX\opera.exe'
        - '%ProgramFiles%\Opera\opera.exe'
        - '%ProgramFiles(x86)%\Opera\opera.exe'
    - name: Claude
      paths:
        - '%LOCALAPPDATA%\AnthropicClaude\claude.exe'
        - '%LOCALAPPDATA%\Programs\Claude\Claude.exe'
        - '%ProgramFiles%\Claude\Claude.exe'
      start_menu: Claude        # yeni Claude Desktop MSIX kimi quraşdırılır → buradan tapılır
      process: claude.exe
      fallback: https://claude.ai
  macos:
    - name: Opera
      paths: ['/Applications/Opera.app/Contents/MacOS/Opera']
    - name: Claude
      paths: ['/Applications/Claude.app/Contents/MacOS/Claude']
      fallback: https://claude.ai
  linux:
    - opera
    - name: Claude
      paths: []
      fallback: https://claude.ai
  urls: []               # əlavə saytlar, məs. - https://github.com/notifications

intruder:
  confirm_frames: 4      # yad üz neçə ardıcıl kadrda görünsün
  cooldown_seconds: 60   # iki xəbərdarlıq arası minimum fasilə
  lock_screen: true      # yad şəxs oturanda ekranı dərhal kilidlə
  alert_when_owner_present: false  # true = arxandan baxan "shoulder surfer"-i də xəbər ver
  save_snapshots: true   # snapshots/ qovluğuna şəkil saxla

telegram:
  # Təhlükəsizlik üçün bunları env dəyişənlərində saxlamaq daha yaxşıdır:
  #   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
  bot_token: ""
  chat_id: ""
  notify_on_lock: false  # hər kilidlənmədə qısa mesaj göndər
